<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Meld je af voor de productmails van ZOL Solutions." />
    <meta name="theme-color" content="#102b4a" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
    <title>Productmail afmelden — ZOL Solutions</title>
  </head>
  <body class="unsubscribe-page">
    <header class="unsubscribe-header"><a href="/" aria-label="ZOL Solutions home"><img src="/media/zol-logo.png" alt="ZOL Solutions" /></a></header>
    <main>
      <section class="unsubscribe-card" aria-labelledby="unsubscribe-title">
        <p class="unsubscribe-eyebrow">Jouw inbox, jouw keuze</p>
        <h1 id="unsubscribe-title">Productmail <em>afmelden.</em></h1>
        <p id="unsubscribe-copy">Je ontvangt daarna geen driewekelijkse producttips meer. Bestel- en servicemails blijven uiteraard wel komen wanneer die nodig zijn.</p>
        <button class="button button--primary" id="unsubscribe-button" type="button">Afmelden <span>→</span></button>
        <p class="unsubscribe-status" id="unsubscribe-status" aria-live="polite"></p>
        <a class="unsubscribe-back" href="/">Terug naar ZOL Solutions</a>
      </section>
    </main>
    <script type="module" src="/src/unsubscribe.js"></script>
  </body>
</html>
